<!DOCTYPE html>

<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
        Exchange
        {% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for(
            'static',
            filename='style.css'
        ) }}"
    >

</head>


<body>


<header class="navbar">

    <div class="logo">
        🔄 Exchange
    </div>


    <nav>

        <a href="{{ url_for('home') }}">
            الرئيسية
        </a>

        <a href="{{ url_for('show_items') }}">
            الأغراض
        </a>

        <a href="{{ url_for('requests') }}">
            طلبات المبادلة
        </a>

        <a href="{{ url_for('about') }}">
            عن الموقع
        </a>

        <a
            href="{{ url_for('add_item') }}"
            class="nav-button"
        >
            + أضف غرضك
        </a>

    </nav>

</header>


<main>

    {% block content %}

    {% endblock %}

</main>


<footer>

    <h3>
        🔄 Exchange
    </h3>

    <p>
        حوّل الأشياء التي لم تعد تحتاجها
        إلى شيء تستفيد منه.
    </p>

    <p class="copyright">
        © 2026 Exchange
    </p>

</footer>


</body>

</html>
